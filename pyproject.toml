[project]
name = "gym-tracker"
version = "0.1.0"
description = "gym-tracker"
requires-python = ">=3.11,<3.13"
dependencies = [
    "aiosqlite",
    "alembic",
    "fastapi",
    "httpx",
    "joblib",
    "numpy",
    "pandas",
    "plotly",
    "prophet",
    "pydantic-settings",
    "python-multipart",
    "scikit-learn",
    "sqlalchemy",
    "streamlit",
    "uvicorn[standard]",
]

[dependency-groups]
dev = [
    "mypy",
    "pandas-stubs",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "ruff",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
    "ASYNC",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers --strict-config"

[tool.coverage.run]
branch = true
source = ["backend"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]
exclude = [
    "^data/",
    "^\\.venv/",
]

[[tool.mypy.overrides]]
module = [
    "joblib.*",
    "plotly.*",
    "prophet.*",
    "sklearn.*",
    "streamlit.*",
]
ignore_missing_imports = true
